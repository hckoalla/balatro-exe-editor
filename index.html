<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balatro EXE Editor</title>
    <style>
      /*
        Loader estático, fora do bundle JS/CSS de propósito — precisa aparecer assim que a
        janela pinta, mesmo antes do React montar (ver bee1-loading-inicial). React substitui
        todo o conteúdo de #root ao montar, então esse markup some sozinho, sem JS extra.
      */
      html,
      body {
        margin: 0;
        background: #0a0710;
      }
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0710;
      }
      .app-loading__track {
        width: 220px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .app-loading__fill {
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: #f3b542;
        animation: app-loading-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-loading-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-label="Loading">
        <div class="app-loading__track">
          <div class="app-loading__fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
