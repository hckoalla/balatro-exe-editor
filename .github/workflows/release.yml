name: Release

# Dispara ao dar push numa tag (ex.: v0.1.0). Builda um .exe portátil (não um instalador -- ver
# bee1-build-portatil) e publica em dois lugares: GitHub Release (criada automaticamente se
# ainda não existir) e itch.io (via butler, usando o environment "production" pro secret
# ITCHIO_SECRET).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    environment: production
    env:
      # Sem certificado de assinatura configurado — sem isso, o electron-builder tenta
      # baixar/extrair o winCodeSign à toa (mesmo gotcha documentado em .claude/CLAUDE.md pro
      # build local).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      - name: Testes
        run: npx vitest run

      - name: Empacotar .exe portátil
        # --publish never desliga o auto-publish do electron-builder (ele tenta publicar
        # sozinho no GitHub Releases se detectar CI + tag, e falha sem GH_TOKEN) — quem
        # publica é o step abaixo, com o .exe já pronto.
        run: npm run package -- --publish never

      - name: Publicar release com o .exe portátil
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.exe
          generate_release_notes: true

      - name: Instalar butler (itch.io)
        # itchio/setup-butler NÃO existe (erro real na primeira tentativa: "repository not
        # found") -- não é uma Action oficial do itch.io, o itch.io não publica uma própria. A
        # que a documentação oficial do itch.io referencia é esta (remarkablegames/setup-butler).
        uses: remarkablegames/setup-butler@v3

      - name: Publicar no itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_SECRET }}
        run: |
          $exe = Get-ChildItem release\*.exe | Select-Object -First 1
          butler push $exe.FullName storydevgames/balatro-exe-editor:win --userversion ${{ github.ref_name }}
