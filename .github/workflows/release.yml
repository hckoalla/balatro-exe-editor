name: Release

# Dispara ao dar push numa tag (ex.: v0.1.0). Builda um .exe portátil (não um instalador -- ver
# bee1-build-portatil) e publica em dois lugares: GitHub Release (criada automaticamente se
# ainda não existir) e itch.io (via butler, usando o environment "production" pro secret
# ITCHIO_SECRET).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    environment: production
    env:
      # Sem certificado de assinatura configurado — sem isso, o electron-builder tenta
      # baixar/extrair o winCodeSign à toa (mesmo gotcha documentado em .claude/CLAUDE.md pro
      # build local).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      - name: Testes
        run: npx vitest run

      - name: Empacotar .exe portátil
        # --publish never desliga o auto-publish do electron-builder (ele tenta publicar
        # sozinho no GitHub Releases se detectar CI + tag, e falha sem GH_TOKEN) — quem
        # publica é o step abaixo, com o .exe já pronto.
        run: npm run package -- --publish never

      - name: Publicar release com o .exe portátil
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.exe
          generate_release_notes: true

      - name: Instalar butler (CLI do itch.io)
        # Instalação oficial documentada pelo itch.io (broth.itch.zone) -- em vez de uma Action
        # de terceiro com acesso ao secret, roda um binário auditável, baixado direto da fonte.
        shell: bash
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          unzip -o butler.zip -d butler
          ./butler/butler -V

      - name: Publicar no itch.io
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_SECRET }}
        run: |
          ./butler/butler push release/*.exe storydevgames/balatro-exe-editor:win --userversion "${GITHUB_REF_NAME#v}"
